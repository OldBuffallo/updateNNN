name: CI - Build & Test

on:
  push:
    branches: [ "main", "develop", "test", "feature/**" ]
  pull_request:
    branches: [ "main", "develop", "test" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore IRM/IRM.csproj
          dotnet restore IRM.Tests/IRM.Tests.csproj

      - name: Build Application & Tests
        run: |
          dotnet build IRM/IRM.csproj -c Release --no-restore
          dotnet build IRM.Tests/IRM.Tests.csproj -c Release --no-restore

      - name: Run xUnit Tests & Collect Coverage
        run: |
          dotnet test IRM.Tests/IRM.Tests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t irm:ci .
