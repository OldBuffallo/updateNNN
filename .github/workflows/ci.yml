name: CI - Build & Test

on:
  push:
    branches: [ "main", "develop", "test", "feature/**" ]
  pull_request:
    branches: [ "main", "develop", "test" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore IRM.sln

      - name: Build Application & Tests
        run: |
          dotnet build IRM.sln -c Release --no-restore

      - name: Run xUnit Tests & Collect Coverage
        run: |
          dotnet test IRM.Tests/IRM.Tests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t irm:ci .

  windows-installer-preflight:
    name: Windows installer environment checks (x64 and x86 PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native Windows PowerShell
        shell: powershell
        run: ./deploy/windows/tests/environment.Tests.ps1
      - name: Check 32-bit PowerShell on 64-bit Windows
        shell: powershell
        run: |
          & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File deploy/windows/tests/environment.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
