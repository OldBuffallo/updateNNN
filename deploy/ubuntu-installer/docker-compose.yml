services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - /opt/irm/data/sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  app:
    image: irm:${IRM_VERSION:-1.0.2}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:5050:5050"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5050
      - Urls=http://0.0.0.0:5050
      - Security__RequireHttpsForRemoteClients=false
      - ConnectionStrings__DefaultConnection=Server=db;Database=IRM;User=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true
      - FileStorage__Root=/app/data/private-files
      - DataProtection__KeysPath=/app/data/dataprotection-keys
    volumes:
      - /opt/irm/data/private-files:/app/data/private-files
      - /opt/irm/data/dataprotection-keys:/app/data/dataprotection-keys

